<!-- ============================================================
     LATIN BY PATTERNS
     CENTRAL CHAPTER LOCKING + PROGRESS SYSTEM

     File:
     _includes/chapter-locks.html

     STORAGE CONVENTIONS:

     Chapter completion:
         latin-chapter-1-complete
         latin-chapter-2-complete
         latin-chapter-3-complete
         etc.

     Exercise completion:
         latin-exercise-complete-chapter-N-EXERCISEID

     Chapter 1 is always unlocked.
     Chapter N requires Chapter N-1 to be complete.

     Exercise completion is earned ONLY when a detected score
     element reports an exact perfect score, such as:

         Score: 10 / 10

     A checked non-perfect score clears completion for that
     exercise. A chapter is complete only when every required
     exercise is currently stored as perfectly completed.

     ============================================================ -->

<!-- ============================================================
     CHAPTER LOCK MODAL
     ============================================================ -->

<div
    id="chapter-lock-modal-overlay"
    class="chapter-lock-modal-overlay"
    aria-hidden="true">

    <div
        class="chapter-lock-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="chapter-lock-modal-title"
        aria-describedby="chapter-lock-modal-message">

            class="chapter-lock-modal-header">

                id="chapter-lock-modal-title"
                class="chapter-lock-modal-title">

                    class="chapter-lock-modal-icon"
                    aria-hidden="true">
                    🔒
                </span>

                Chapter Locked

            </h3>

            </button>

        </div>

<script>

(function(){

    "use strict";


    if (
        window.__latinByPatternsChapterLocksLoaded
    ) {

        if (
            typeof window.updateAllChapterNavigation ===
            "function"
        ) {

            window.updateAllChapterNavigation();

        }

        return;

    }


    window.__latinByPatternsChapterLocksLoaded =
        true;


    /* ========================================================
       INTERNAL STATE
       ======================================================== */

    let modalSourceElement = null;

    let progressObserver = null;

    let navigationObserver = null;

    let navigationRefreshTimer = null;

    let pageRefreshRunning = false;

    let detectedExercises = [];



    /* ========================================================
       CURRENT CHAPTER
       ======================================================== */

    function getCurrentChapterNumber() {

        /*
        GitBook can change pages without replacing <body>, so
        data-current-chapter can be stale. Resolve the chapter
        from the CURRENT rendered page before trusting <body>.
        */

        const candidates = [];


        const bodyInner =
            document.querySelector(
                ".body-inner"
            );


        if (bodyInner) {

            const headings =
                bodyInner.querySelectorAll(
                    "h1, h2, h3"
                );


            headings.forEach(
                function(heading){

                    candidates.push(
                        heading.textContent || ""
                    );

                }
            );

        }


        candidates.push(
            document.title || "",
            window.location.pathname || "",
            window.location.href || ""
        );


        for (
            let i = 0;
            i < candidates.length;
            i += 1
        ) {

            const value =
                String(
                    candidates[i]
                );


            let match =
                value.match(
                    /\bChapter\s+(\d+)\b/i
                );


            if (!match) {

                match =
                    value.match(
                        /(?:CH|Chapter)[\s\-_:/]*(\d+)/i
                    );

            }


            if (!match) {

                match =
                    value.match(
                        /\/Chapter-(\d+)\//i
                    );

            }


            if (!match) {

                continue;

            }


            const chapterNumber =
                parseInt(
                    match[1],
                    10
                );


            if (
                chapterNumber &&
                !Number.isNaN(
                    chapterNumber
                )
            ) {

                /*
                Synchronize the body attribute so any other code
                reading it sees the CURRENT GitBook page.
                */

                if (document.body) {

                    document.body.setAttribute(
                        "data-current-chapter",
                        String(
                            chapterNumber
                        )
                    );

                }


                return chapterNumber;

            }

        }


        /*
        IMPORTANT:
        If the CURRENT rendered content, title, and URL do not
        identify a chapter, this is a non-chapter page such as
        README/home.

        GitBook can leave the previous post's
        data-current-chapter value on <body> after client-side
        navigation. Never fall back to that stale value here,
        because the homepage has zero exercises and would
        otherwise be mistaken for the previous chapter and
        automatically complete it.
        */

        if (document.body) {

            document.body.removeAttribute(
                "data-current-chapter"
            );

        }


        return null;

    }



    /* ========================================================
       STORAGE KEYS
       ======================================================== */

    function chapterCompletionKey(
        chapterNumber
    ) {

        return (
            "latin-chapter-" +
            chapterNumber +
            "-complete"
        );

    }



    function chapterUnlockKey(
        chapterNumber
    ) {

        return (
            "latin-chapter-" +
            chapterNumber +
            "-unlocked"
        );

    }



    function exerciseCompletionKey(
        chapterNumber,
        exerciseId
    ) {

        return (
            "latin-exercise-complete-chapter-" +
            chapterNumber +
            "-" +
            exerciseId
        );

    }



    /* ========================================================
       SAFE LOCAL STORAGE
       ======================================================== */

    function storageGet(
        key
    ) {

        try {

            return localStorage.getItem(
                key
            );

        }

        catch (error) {

            return null;

        }

    }



    function storageSet(
        key,
        value
    ) {

        try {

            localStorage.setItem(
                key,
                value
            );

            return true;

        }

        catch (error) {

            return false;

        }

    }



    function storageRemove(
        key
    ) {

        try {

            localStorage.removeItem(
                key
            );

            return true;

        }

        catch (error) {

            return false;

        }

    }



    /* ========================================================
       CHAPTER COMPLETION CHECK
       ======================================================== */

    function isChapterComplete(
        chapterNumber
    ) {

        if (
            !chapterNumber ||
            chapterNumber < 1
        ) {

            return false;

        }


        return (
            storageGet(
                chapterCompletionKey(
                    chapterNumber
                )
            ) === "true"
        );

    }



    /* ========================================================
       CHAPTER UNLOCK CHECK
       ======================================================== */

    function isChapterUnlocked(
        chapterNumber
    ) {

        chapterNumber =
            parseInt(
                chapterNumber,
                10
            );


        if (
            !chapterNumber ||
            Number.isNaN(
                chapterNumber
            ) ||
            chapterNumber < 1
        ) {

            return false;

        }


        /*
        Chapter 1 is always unlocked.
        */

        if (chapterNumber === 1) {

            return true;

        }


        /*
        Every later chapter is unlocked ONLY by validated
        completion of the immediately preceding chapter.

        Do not use a separate persistent "-unlocked" key here.
        That shortcut can preserve an invalid unlock after a
        failed exercise attempt.
        */

        return isChapterComplete(
            chapterNumber - 1
        );

    }



    /* ========================================================
       MARK CHAPTER COMPLETE
       ======================================================== */

    function markChapterComplete(
        chapterNumber
    ) {

        if (
            !chapterNumber ||
            chapterNumber < 1
        ) {

            return false;

        }


        const alreadyComplete =
            isChapterComplete(
                chapterNumber
            );


        const stored =
            storageSet(

                chapterCompletionKey(
                    chapterNumber
                ),

                "true"

            );


        if (!stored) {

            return false;

        }


        updateAllChapterNavigation();


        /*
        Only dispatch the completion event the first
        time the chapter becomes complete.
        */

        if (!alreadyComplete) {

            document.dispatchEvent(

                new CustomEvent(
                    "latinChapterCompleted",
                    {
                        detail: {
                            chapter:
                                chapterNumber
                        }
                    }
                )

            );

        }


        return true;

    }



    /* ========================================================
       OPTIONAL CHAPTER RESET
       ======================================================== */

    function clearChapterComplete(
        chapterNumber
    ) {

        if (
            !chapterNumber ||
            chapterNumber < 1
        ) {

            return false;

        }


        storageRemove(
            chapterCompletionKey(
                chapterNumber
            )
        );


        updateAllChapterNavigation();

        updateChapterProgress();


        return true;

    }



    /* ========================================================
       NORMALIZE EXERCISE ID
       ======================================================== */

    function normalizeExerciseId(
        value
    ) {

        return String(
            value || ""
        )
        .trim()
        .toLowerCase()
        .replace(
            /[^a-z0-9_-]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            ""
        );

    }



    /* ========================================================
       DETECT SCORE FROM TEXT
       ======================================================== */

    function parseScoreText(
        text
    ) {

        if (!text) {

            return null;

        }


        /*
        Accepted forms include:

        Score: 10 / 10
        Score: 10/10
        Your Score: 8 / 10
        8 / 10

        The final fraction found in the string is used.
        */

        const matches =
            String(text).match(
                /(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/g
            );


        if (
            !matches ||
            matches.length === 0
        ) {

            return null;

        }


        const finalMatch =
            matches[
                matches.length - 1
            ];


        const pieces =
            finalMatch.match(
                /(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/
            );


        if (!pieces) {

            return null;

        }


        const earned =
            Number(
                pieces[1]
            );


        const possible =
            Number(
                pieces[2]
            );


        if (
            !Number.isFinite(
                earned
            ) ||
            !Number.isFinite(
                possible
            ) ||
            possible <= 0
        ) {

            return null;

        }


        return {
            earned:
                earned,

            possible:
                possible,

            perfect:
                earned === possible
        };

    }



    /* ========================================================
       IDENTIFY SCORE ELEMENTS
       ======================================================== */

    function findScoreElements() {

        const candidates =
            Array.from(
                document.querySelectorAll(
                    '[data-exercise-score], [id$="-score"]'
                )
            );


        return Array.from(
            new Set(
                candidates
            )
        )
        .filter(
            function(element){

                return !element.closest(
                    ".chapter-progress-panel"
                );

            }
        );

    }



    /* ========================================================
       BUILD EXERCISE ID
       ======================================================== */

    function getExerciseId(
        scoreElement,
        index
    ) {

        /*
        Best option: explicit data attribute.
        */

        if (
            scoreElement.dataset &&
            scoreElement.dataset.exerciseId
        ) {

            return normalizeExerciseId(
                scoreElement.dataset.exerciseId
            );

        }


        /*
        Existing ID such as:

        pron-score
        sp-score
        func-score
        rel-score
        */

        if (scoreElement.id) {

            return normalizeExerciseId(
                scoreElement.id
            );

        }


        /*
        Try to find an ancestor widget ID.
        */

        const ancestorWithId =
            scoreElement.closest(
                "[id]"
            );


        if (
            ancestorWithId &&
            ancestorWithId.id
        ) {

            return normalizeExerciseId(
                ancestorWithId.id
            );

        }


        /*
        Fall back to DOM order.
        */

        return (
            "exercise-" +
            (index + 1)
        );

    }



    /* ========================================================
       SCAN CHAPTER EXERCISES
       ======================================================== */

    function detectChapterExercises() {

        const scoreElements =
            findScoreElements();


        const exercises = [];

        const usedIds =
            new Set();


        scoreElements.forEach(
            function(
                element,
                index
            ){

                let exerciseId =
                    getExerciseId(
                        element,
                        index
                    );


                /*
                Prevent accidental duplicate IDs if two
                score containers happen to share an ID-like
                ancestor.
                */

                const baseId =
                    exerciseId;


                let suffix = 2;


                while (
                    usedIds.has(
                        exerciseId
                    )
                ) {

                    exerciseId =
                        baseId +
                        "-" +
                        suffix;

                    suffix += 1;

                }


                usedIds.add(
                    exerciseId
                );


                exercises.push({

                    id:
                        exerciseId,

                    element:
                        element

                });

            }
        );


        detectedExercises =
            exercises;


        return exercises;

    }



    /* ========================================================
       EXERCISE COMPLETION STORAGE
       ======================================================== */

    function isExerciseComplete(
        chapterNumber,
        exerciseId
    ) {

        return (
            storageGet(
                exerciseCompletionKey(
                    chapterNumber,
                    exerciseId
                )
            ) === "true"
        );

    }



    function markExerciseComplete(
        chapterNumber,
        exerciseId
    ) {

        storageSet(

            exerciseCompletionKey(
                chapterNumber,
                exerciseId
            ),

            "true"

        );

    }



    function clearExerciseComplete(
        chapterNumber,
        exerciseId
    ) {

        storageRemove(
            exerciseCompletionKey(
                chapterNumber,
                exerciseId
            )
        );

    }



    /* ========================================================
       CHECK CURRENT SCORE ELEMENTS
       ======================================================== */

    function processExerciseScores() {

        const chapterNumber =
            getCurrentChapterNumber();


        if (!chapterNumber) {

            return;

        }


        if (
            detectedExercises.length === 0
        ) {

            detectChapterExercises();

        }


        detectedExercises.forEach(
            function(exercise){

                const score =
                    parseScoreText(
                        exercise.element.textContent
                    );


                /*
                No displayed score means the exercise has not
                been checked during this page state. Do not
                change its stored completion.
                */

                if (!score) {

                    return;

                }


                /*
                An exercise is complete ONLY when every point is
                correct. Any checked non-perfect score explicitly
                removes completion for that exercise.
                */

                if (score.perfect) {

                    markExerciseComplete(
                        chapterNumber,
                        exercise.id
                    );

                }

                else {

                    clearExerciseComplete(
                        chapterNumber,
                        exercise.id
                    );

                }

            }
        );

    }



    /* ========================================================
       GET EXERCISE PROGRESS
       ======================================================== */

    function getExerciseProgress() {

        const chapterNumber =
            getCurrentChapterNumber();


        if (!chapterNumber) {

            return null;

        }


        if (
            detectedExercises.length === 0
        ) {

            detectChapterExercises();

        }


        let completed = 0;


        detectedExercises.forEach(
            function(exercise){

                if (
                    isExerciseComplete(
                        chapterNumber,
                        exercise.id
                    )
                ) {

                    completed += 1;

                }

            }
        );


        return {

            chapterNumber:
                chapterNumber,

            total:
                detectedExercises.length,

            completed:
                completed

        };

    }



    /* ========================================================
       CREATE CHAPTER PROGRESS PANEL
       ======================================================== */

    function ensureProgressPanel() {

        const chapterNumber =
            getCurrentChapterNumber();


        if (!chapterNumber) {

            return null;

        }


        let panel =
            document.getElementById(
                "chapter-progress-panel"
            );


        if (panel) {

            return panel;

        }


        panel =
            document.createElement(
                "section"
            );


        panel.id =
            "chapter-progress-panel";


        panel.className =
            "chapter-progress-panel";


        panel.setAttribute(
            "aria-label",
            "Chapter progress"
        );


        panel.innerHTML =
            '<div class="chapter-progress-heading">' +
                'Chapter Progress' +
            '</div>' +

            '<p ' +
                'id="chapter-progress-text" ' +
                'class="chapter-progress-text">' +
            '</p>' +

            '<div ' +
                'class="chapter-progress-track" ' +
                'role="progressbar" ' +
                'aria-valuemin="0" ' +
                'aria-valuemax="100" ' +
                'aria-valuenow="0">' +

                '<div ' +
                    'id="chapter-progress-fill" ' +
                    'class="chapter-progress-fill">' +
                '</div>' +

            '</div>' +

            '<div ' +
                'id="chapter-progress-status" ' +
                'class="chapter-progress-status">' +
            '</div>';


        /*
        Put the progress panel at the end of the chapter
        content but before the previous/next navigation.

        body.html normally renders inside .body-inner.
        */

        const bodyInner =
            document.querySelector(
                ".body-inner"
            );


        if (!bodyInner) {

            return null;

        }


        const navigationElement =
            bodyInner.querySelector(
                ".navigation"
            );


        if (navigationElement) {

            bodyInner.insertBefore(
                panel,
                navigationElement
            );

        }

        else {

            bodyInner.appendChild(
                panel
            );

        }


        return panel;

    }



    /* ========================================================
       UPDATE CHAPTER PROGRESS PANEL
       ======================================================== */

    function updateChapterProgress() {

        const chapterNumber =
            getCurrentChapterNumber();


        if (!chapterNumber) {

            /*
            Never evaluate chapter completion on README/home or
            any other non-chapter page.
            */

            return;

        }


        processExerciseScores();


        const progress =
            getExerciseProgress();


        if (!progress) {

            return;

        }


        const panel =
            ensureProgressPanel();


        if (!panel) {

            return;

        }


        const textElement =
            document.getElementById(
                "chapter-progress-text"
            );


        const fillElement =
            document.getElementById(
                "chapter-progress-fill"
            );


        const statusElement =
            document.getElementById(
                "chapter-progress-status"
            );


        const progressTrack =
            panel.querySelector(
                ".chapter-progress-track"
            );


        /* =====================================================
           CHAPTER WITH NO DETECTED SCORED EXERCISES
           ===================================================== */

        if (
            progress.total === 0
        ) {

            /*
            If there are no scored exercises in the chapter,
            visiting the chapter counts as completing it.

            This prevents review/content-only chapters from
            permanently blocking the next chapter.
            */

            markChapterComplete(
                chapterNumber
            );


            if (textElement) {

                textElement.textContent =
                    "This chapter contains no required scored exercises.";

            }


            if (fillElement) {

                fillElement.style.width =
                    "100%";

            }


            if (progressTrack) {

                progressTrack.setAttribute(
                    "aria-valuenow",
                    "100"
                );

            }


            if (statusElement) {

                statusElement.textContent =
                    "✓ Chapter " +
                    chapterNumber +
                    " complete.";

                statusElement.classList.add(
                    "chapter-progress-complete"
                );

            }


            return;

        }



        /* =====================================================
           STANDARD SCORED CHAPTER
           ===================================================== */

        const percent =
            Math.round(

                (
                    progress.completed /
                    progress.total
                ) *
                100

            );


        if (textElement) {

            textElement.textContent =
                progress.completed +
                " of " +
                progress.total +
                " required exercises completed.";

        }


        if (fillElement) {

            fillElement.style.width =
                percent +
                "%";

        }


        if (progressTrack) {

            progressTrack.setAttribute(
                "aria-valuenow",
                String(
                    percent
                )
            );

        }


        if (
            progress.total > 0 &&
            progress.completed ===
            progress.total
        ) {

            markChapterComplete(
                chapterNumber
            );


            if (statusElement) {

                statusElement.textContent =
                    "✓ Chapter " +
                    chapterNumber +
                    " complete. The next chapter is unlocked.";

                statusElement.classList.add(
                    "chapter-progress-complete"
                );

            }

        }

        else {

            /*
            If even one required exercise is incomplete, this
            chapter is NOT complete. Remove any stale completion
            value that may have been created by an earlier version
            of the locking code.
            */

            storageRemove(
                chapterCompletionKey(
                    chapterNumber
                )
            );


            updateAllChapterNavigation();


            if (statusElement) {

                statusElement.textContent =
                    "Complete each required exercise with a perfect score to unlock the next chapter.";

                statusElement.classList.remove(
                    "chapter-progress-complete"
                );

            }

        }

    }



    /* ========================================================
       SHOW CUSTOM LOCK MODAL
       ======================================================== */

    function showChapterLockModal(
        chapterNumber,
        sourceElement
    ) {

        const overlay =
            document.getElementById(
                "chapter-lock-modal-overlay"
            );


        const message =
            document.getElementById(
                "chapter-lock-modal-message"
            );


        const closeButton =
            document.getElementById(
                "chapter-lock-modal-close"
            );


        if (
            !overlay ||
            !message
        ) {

            return;

        }


        modalSourceElement =
            sourceElement || null;


        if (
            chapterNumber &&
            chapterNumber > 1
        ) {

            const requiredChapter =
                chapterNumber - 1;


            message.textContent =
                "Chapter " +
                chapterNumber +
                " is locked. Complete all required exercises in Chapter " +
                requiredChapter +
                " to unlock it.";

        }

        else {

            message.textContent =
                "This chapter is currently locked.";

        }


        overlay.classList.add(
            "chapter-lock-modal-visible"
        );


        overlay.setAttribute(
            "aria-hidden",
            "false"
        );


        document.body.style.overflow =
            "hidden";


        if (closeButton) {

            window.setTimeout(
                function(){

                    closeButton.focus();

                },
                0
            );

        }

    }



    /* ========================================================
       CLOSE CUSTOM LOCK MODAL
       ======================================================== */

    function closeChapterLockModal() {

        const overlay =
            document.getElementById(
                "chapter-lock-modal-overlay"
            );


        if (!overlay) {

            return;

        }


        overlay.classList.remove(
            "chapter-lock-modal-visible"
        );


        overlay.setAttribute(
            "aria-hidden",
            "true"
        );


        document.body.style.overflow =
            "";


        if (modalSourceElement) {

            const elementToFocus =
                modalSourceElement;


            window.setTimeout(
                function(){

                    try {

                        elementToFocus.focus();

                    }

                    catch (error) {

                        /*
                        No action needed.
                        */

                    }

                },
                0
            );

        }


        modalSourceElement =
            null;

    }



    /* ========================================================
       CHAPTER NUMBER FROM ANY CHAPTER LINK
       ======================================================== */

    function getChapterNumberFromLink(
        link
    ) {

        if (!link) {

            return null;

        }


        const explicit =
            parseInt(
                link.getAttribute(
                    "data-chapter"
                ),
                10
            );


        if (
            explicit &&
            !Number.isNaN(
                explicit
            )
        ) {

            return explicit;

        }


        const explicitNext =
            parseInt(
                link.getAttribute(
                    "data-next-chapter"
                ),
                10
            );


        if (
            explicitNext &&
            !Number.isNaN(
                explicitNext
            )
        ) {

            return explicitNext;

        }


        const values = [
            link.textContent || "",
            link.getAttribute("aria-label") || "",
            link.getAttribute("title") || "",
            link.getAttribute("href") || ""
        ];


        for (
            let i = 0;
            i < values.length;
            i += 1
        ) {

            const match =
                String(
                    values[i]
                ).match(
                    /\bChapter\s+(\d+)\b/i
                );


            if (match) {

                const chapterNumber =
                    parseInt(
                        match[1],
                        10
                    );


                if (
                    chapterNumber &&
                    !Number.isNaN(
                        chapterNumber
                    )
                ) {

                    return chapterNumber;

                }

            }

        }


        return null;

    }



    /* ========================================================
       DETERMINE WHETHER A LINK IS A CHAPTER LINK
       ======================================================== */

    function isChapterNavigationLink(
        link
    ) {

        if (!link) {

            return false;

        }


        if (
            link.classList.contains(
                "chapter-next-lock-link"
            )
        ) {

            return false;

        }


        return (
            getChapterNumberFromLink(
                link
            ) !== null
        );

    }



    /* ========================================================
       APPLY STATE TO ONE HOME/SIDEBAR CHAPTER LINK
       ======================================================== */

    function updateSidebarChapterLink(
        link
    ) {

        const chapterNumber =
            getChapterNumberFromLink(
                link
            );


        if (!chapterNumber) {

            return;

        }


        link.classList.add(
            "chapter-lock-link"
        );


        link.setAttribute(
            "data-chapter",
            String(
                chapterNumber
            )
        );


        const unlocked =
            isChapterUnlocked(
                chapterNumber
            );


        link.classList.toggle(
            "chapter-unlocked",
            unlocked
        );


        link.classList.toggle(
            "chapter-locked",
            !unlocked
        );


        link.setAttribute(
            "aria-disabled",
            unlocked
                ? "false"
                : "true"
        );


        if (unlocked) {

            link.removeAttribute(
                "data-latin-locked"
            );

            link.removeAttribute(
                "tabindex"
            );

        }

        else {

            link.setAttribute(
                "data-latin-locked",
                "true"
            );

            link.setAttribute(
                "tabindex",
                "0"
            );

        }


        const parent =
            link.closest(
                "li.chapter"
            );


        if (parent) {

            parent.classList.toggle(
                "chapter-is-locked",
                !unlocked
            );

        }

    }



    /* ========================================================
       UPDATE ALL HOME/SIDEBAR CHAPTER LINKS
       ======================================================== */

    function updateChapterNavigation() {

        const links =
            Array.from(
                document.querySelectorAll(
                    "a"
                )
            )
            .filter(
                isChapterNavigationLink
            );


        links.forEach(
            updateSidebarChapterLink
        );

    }



    /* ========================================================
       UPDATE NEXT-CHAPTER ARROW
       ======================================================== */

    function updateNextChapterNavigation() {

        const links =
            document.querySelectorAll(
                "a.chapter-next-lock-link"
            );


        links.forEach(
            function(link){

                const chapterNumber =
                    getChapterNumberFromLink(
                        link
                    );


                if (!chapterNumber) {

                    return;

                }


                const unlocked =
                    isChapterUnlocked(
                        chapterNumber
                    );


                link.classList.toggle(
                    "chapter-next-unlocked",
                    unlocked
                );


                link.classList.toggle(
                    "chapter-next-locked",
                    !unlocked
                );


                link.setAttribute(
                    "aria-disabled",
                    unlocked
                        ? "false"
                        : "true"
                );


                if (unlocked) {

                    link.removeAttribute(
                        "data-latin-locked"
                    );

                    link.removeAttribute(
                        "tabindex"
                    );

                }

                else {

                    link.setAttribute(
                        "data-latin-locked",
                        "true"
                    );

                    link.setAttribute(
                        "tabindex",
                        "0"
                    );

                }

            }
        );

    }



    /* ========================================================
       UPDATE ALL CHAPTER NAVIGATION
       ======================================================== */

    function updateAllChapterNavigation() {

        updateChapterNavigation();

        updateNextChapterNavigation();

    }



    /* ========================================================
       AUTHORITATIVE CAPTURE-PHASE CLICK GATE
       ======================================================== */

    function handleChapterNavigationClick(
        event
    ) {

        const link =
            event.target.closest(
                "a"
            );


        if (!link) {

            return;

        }


        const chapterNumber =
            getChapterNumberFromLink(
                link
            );


        if (!chapterNumber) {

            return;

        }


        const isNext =
            link.classList.contains(
                "chapter-next-lock-link"
            );


        const isChapterLink =
            link.classList.contains(
                "chapter-lock-link"
            ) ||
            isChapterNavigationLink(
                link
            );


        if (
            !isNext &&
            !isChapterLink
        ) {

            return;

        }


        if (
            isChapterUnlocked(
                chapterNumber
            )
        ) {

            return;

        }


        event.preventDefault();

        event.stopPropagation();

        event.stopImmediatePropagation();


        showChapterLockModal(
            chapterNumber,
            link
        );


        return false;

    }



    /* ========================================================
       KEYBOARD GATE FOR LOCKED CHAPTER LINKS
       ======================================================== */

    function handleLockedNavigationKeydown(
        event
    ) {

        if (
            event.key !== "Enter" &&
            event.key !== " "
        ) {

            return;

        }


        const link =
            event.target.closest(
                "a"
            );


        if (!link) {

            return;

        }


        const chapterNumber =
            getChapterNumberFromLink(
                link
            );


        if (
            !chapterNumber ||
            isChapterUnlocked(
                chapterNumber
            )
        ) {

            return;

        }


        if (
            !link.classList.contains(
                "chapter-lock-link"
            ) &&
            !link.classList.contains(
                "chapter-next-lock-link"
            )
        ) {

            return;

        }


        event.preventDefault();

        event.stopPropagation();

        event.stopImmediatePropagation();


        showChapterLockModal(
            chapterNumber,
            link
        );

    }



    /* ========================================================
       MODAL CLICK HANDLER
       ======================================================== */

    function handleModalClick(
        event
    ) {

        if (
            event.target.id ===
            "chapter-lock-modal-close"
        ) {

            closeChapterLockModal();

            return;

        }


        if (
            event.target.id ===
            "chapter-lock-modal-overlay"
        ) {

            closeChapterLockModal();

        }

    }



    /* ========================================================
       MODAL ESCAPE KEY
       ======================================================== */

    function handleModalKeydown(
        event
    ) {

        if (
            event.key !== "Escape"
        ) {

            return;

        }


        const overlay =
            document.getElementById(
                "chapter-lock-modal-overlay"
            );


        if (
            overlay &&
            overlay.classList.contains(
                "chapter-lock-modal-visible"
            )
        ) {

            event.preventDefault();

            closeChapterLockModal();

        }

    }



    /* ========================================================
       DIRECT URL PROTECTION
       ======================================================== */

    function protectCurrentChapter() {

        const currentChapter =
            getCurrentChapterNumber();


        if (
            !currentChapter ||
            currentChapter <= 1
        ) {

            return;

        }


        if (
            isChapterUnlocked(
                currentChapter
            )
        ) {

            return;

        }


        const previousLink =
            document.querySelector(
                'link[rel="prev"]'
            );


        let destination =
            "{{site.baseurl}}/";


        if (
            previousLink &&
            previousLink.href
        ) {

            destination =
                previousLink.href;

        }


        window.location.replace(
            destination
        );

    }



    /* ========================================================
       WATCH SCORE ELEMENTS FOR CHANGES
       ======================================================== */

    function startProgressObserver() {

        if (progressObserver) {

            progressObserver.disconnect();

        }


        const bodyInner =
            document.querySelector(
                ".body-inner"
            );


        if (!bodyInner) {

            return;

        }


        progressObserver =
            new MutationObserver(
                function(){

                    window.clearTimeout(
                        startProgressObserver.updateTimer
                    );


                    startProgressObserver.updateTimer =
                        window.setTimeout(
                            function(){

                                detectChapterExercises();

                                updateChapterProgress();

                            },
                            40
                        );

                }
            );


        progressObserver.observe(
            bodyInner,
            {
                childList: true,
                subtree: true,
                characterData: true
            }
        );

    }



    /* ========================================================
       REFRESH ALL PAGE-SPECIFIC LOCK STATE
       ======================================================== */

    function refreshChapterLockState() {

        if (pageRefreshRunning) {

            return;

        }


        pageRefreshRunning =
            true;


        /*
        A GitBook page transition can replace .body-inner while
        leaving this script and <body> alive. Discard all cached
        exercise references and rebuild them from the current DOM.
        */

        detectedExercises = [];


        const currentChapter =
            getCurrentChapterNumber();


        if (currentChapter) {

            protectCurrentChapter();

            detectChapterExercises();

            updateChapterProgress();

        }

        else {

            /*
            README/home and other non-chapter pages must NEVER
            participate in exercise or chapter completion.

            Remove any stale chapter-progress panel that may have
            survived a client-side GitBook transition.
            */

            const staleProgressPanel =
                document.getElementById(
                    "chapter-progress-panel"
                );


            if (staleProgressPanel) {

                staleProgressPanel.remove();

            }

        }


        /*
        Homepage and chapter pages both use this same navigation
        refresh, so the sidebar always derives its state from the
        same chapter-completion keys.
        */

        updateAllChapterNavigation();


        /*
        The old .body-inner may have been replaced. Reattach the
        score observer to the newly rendered chapter content.
        */

        startProgressObserver();


        window.setTimeout(
            function(){

                pageRefreshRunning =
                    false;

            },
            0
        );

    }



    /* ========================================================
       GITBOOK CLIENT-SIDE PAGE CHANGE EVENTS
       ======================================================== */

    function registerGitBookPageChangeHooks() {

        function bindGitBookEvent() {

            if (
                window.gitbook &&
                window.gitbook.events &&
                typeof window.gitbook.events.bind ===
                    "function"
            ) {

                if (
                    window.__latinGitBookPageChangeBound
                ) {

                    return true;

                }


                window.__latinGitBookPageChangeBound =
                    true;


                window.gitbook.events.bind(
                    "page.change",
                    function(){

                        window.setTimeout(
                            refreshChapterLockState,
                            0
                        );

                    }
                );


                return true;

            }


            return false;

        }


        if (
            !bindGitBookEvent()
        ) {

            let attempts = 0;


            const timer =
                window.setInterval(
                    function(){

                        attempts += 1;


                        if (
                            bindGitBookEvent() ||
                            attempts >= 40
                        ) {

                            window.clearInterval(
                                timer
                            );

                        }

                    },
                    100
                );

        }


        /*
        Browser Back/Forward can also change GitBook content
        without a normal document reload.
        */

        window.addEventListener(
            "popstate",
            function(){

                window.setTimeout(
                    refreshChapterLockState,
                    0
                );

            }
        );

    }



    /* ========================================================
       WATCH HOME/SIDEBAR DOM CHANGES
       ======================================================== */

    function startNavigationObserver() {

        if (navigationObserver) {

            navigationObserver.disconnect();

        }


        navigationObserver =
            new MutationObserver(
                function(){

                    window.clearTimeout(
                        navigationRefreshTimer
                    );


                    navigationRefreshTimer =
                        window.setTimeout(
                            function(){

                                refreshChapterLockState();

                            },
                            25
                        );

                }
            );


        navigationObserver.observe(
            document.documentElement,
            {
                childList: true,
                subtree: true
            }
        );

    }



    /* ========================================================
       INITIALIZE
       ======================================================== */

    function initializeChapterLocks() {

        /*
        Build the initial state from the currently rendered page.
        */

        refreshChapterLockState();


        /*
        Keep navigation synchronized if the theme rewrites the
        sidebar or page body.
        */

        startNavigationObserver();


        /*
        Rebuild state after GitBook client-side page changes.
        */

        registerGitBookPageChangeHooks();

    }



    /* ========================================================
       PUBLIC API
       ======================================================== */

    window.updateChapterNavigation =
        updateAllChapterNavigation;


    window.updateAllChapterNavigation =
        updateAllChapterNavigation;


    window.updateNextChapterNavigation =
        updateNextChapterNavigation;


    window.updateChapterProgress =
        updateChapterProgress;


    window.refreshLatinChapterLockState =
        refreshChapterLockState;


    window.isLatinChapterComplete =
        isChapterComplete;


    window.isLatinChapterUnlocked =
        isChapterUnlocked;


    window.markLatinChapterComplete =
        markChapterComplete;


    window.clearLatinChapterComplete =
        clearChapterComplete;


    window.showChapterLockModal =
        showChapterLockModal;


    window.closeChapterLockModal =
        closeChapterLockModal;



    /* ========================================================
       CAPTURE-PHASE NAVIGATION LISTENERS
       ======================================================== */

    document.addEventListener(
        "click",
        handleChapterNavigationClick,
        true
    );



    /* ========================================================
       KEYBOARD LISTENER
       ======================================================== */

    document.addEventListener(
        "keydown",
        handleLockedNavigationKeydown,
        true
    );



    /* ========================================================
       MODAL LISTENERS
       ======================================================== */

    document.addEventListener(
        "click",
        handleModalClick
    );


    document.addEventListener(
        "keydown",
        handleModalKeydown
    );



    /* ========================================================
       REFRESH AFTER INTERACTIONS
       ======================================================== */

    document.addEventListener(
        "click",
        function(){

            window.setTimeout(
                function(){

                    refreshChapterLockState();

                },
                0
            );

        }
    );



    /* ========================================================
       CUSTOM CHAPTER COMPLETION EVENT
       ======================================================== */

    document.addEventListener(
        "latinChapterCompleted",
        function(){

            refreshChapterLockState();

        }
    );



    /* ========================================================
       MULTIPLE TAB / WINDOW SUPPORT
       ======================================================== */

    window.addEventListener(
        "storage",
        function(){

            refreshChapterLockState();

        }
    );



    /* ========================================================
       PAGE LOAD
       ======================================================== */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initializeChapterLocks
        );

    }

    else {

        initializeChapterLocks();

    }


})();

</script>
